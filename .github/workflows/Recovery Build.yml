
name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "TWRP manifest URL"
        required: true
        default: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp"

      MANIFEST_BRANCH:
        description: "TWRP manifest branch"
        required: true
        default: "twrp-12.1"

      DEVICE_TREE_URL:
        description: "BF7 device tree URL"
        required: true
        default: "https://github.com/legendary0op/android_device_tecno_TECNO-BF7"

      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "main"

      DEVICE_PATH:
        description: "Device tree path"
        required: true
        default: "device/tecno/BF7"

      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "BF7"

      MAKEFILE_NAME:
        description: "Lunch product name"
        required: true
        default: "twrp_BF7"

      BUILD_TARGET:
        description: "Build target"
        required: true
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
        default: boot

jobs:
  build:
    name: Build TWRP for BF7
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            python3 \
            python-is-python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install Repo
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            -u "${{ inputs.MANIFEST_URL }}" \
            -b "${{ inputs.MANIFEST_BRANCH }}" \
            --depth=1

      - name: Sync TWRP source
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          repo sync \
            -c \
            -j2 \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Clone BF7 device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          git clone \
            --depth=1 \
            -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE_URL }}" \
            "${{ inputs.DEVICE_PATH }}"

          echo "Device tree contents:"
          ls -la "${{ inputs.DEVICE_PATH }}"

      - name: Check device tree configuration
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          test -f "${{ inputs.DEVICE_PATH }}/AndroidProducts.mk"
          test -f "${{ inputs.DEVICE_PATH }}/BoardConfig.mk"

          echo "Device tree configuration found."

      - name: Configure build environment
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch "${{ inputs.MAKEFILE_NAME }}-eng"

      - name: Build recovery
        shell: bash
        run: |
          set -o pipefail

          cd "$GITHUB_WORKSPACE/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh
          lunch "${{ inputs.MAKEFILE_NAME }}-eng"

          echo "Starting TWRP build..."

          case "${{ inputs.BUILD_TARGET }}" in
            boot)
              mka bootimage -j2
              ;;
            recovery)
              mka recoveryimage -j2
              ;;
            vendorboot)
              mka vendorbootimage -j2
              ;;
            *)
              echo "Invalid build target"
              exit 1
              ;;
          esac 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show build output
        if: always()
        run: |
          echo "Checking output directory..."
          ls -lah "$GITHUB_WORKSPACE/twrp/out/target/product/${{ inputs.DEVICE_NAME }}" || true

          echo "Last build log lines:"
          tail -n 100 "$GITHUB_WORKSPACE/build.log" || true

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-BF7-${{ inputs.BUILD_TARGET }}
          path: |
            twrp/out/target/product/${{ inputs.DEVICE_NAME }}/*.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BF7-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
